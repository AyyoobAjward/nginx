user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

# ============================================================
# IMPORTANT: The 'stream' module (used for L4 proxying) is NOT
# built into nginx by default. You must first install it:
#
#   sudo apt install libnginx-mod-stream
#
# Then this include picks up the generated .conf file that
# loads the module dynamically.
# ============================================================
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

# ============================================================
# L4 PROXY — Transport Layer (TCP/UDP)
# Lives in the top-level 'stream' block, NOT inside 'http'.
#
# Key characteristics:
#   - Cannot read or modify HTTP headers (no proxy_set_header)
#   - Cannot route by URL path, method, or Host header
#   - Must proxy_pass using raw IP:PORT — HTTP scheme not allowed
#   - All original client headers are forwarded as-is (pass-through)
#   - Connection behaviour: nginx keeps it alive (keep-alive),
#     unlike L7 where it sends 'close' by default
# ============================================================
stream {
    server {
        listen 3001;

        # Raw TCP passthrough — must be IP:PORT, not http://...
        proxy_pass 127.0.0.1:3080;
    }
}

# ============================================================
# L7 PROXY — Application Layer (HTTP)
# Lives inside the 'http' block.
#
# Key characteristics:
#   - Can read, add, modify, and strip HTTP headers
#   - Can route by URL path (/server/), method, Host, etc.
#   - proxy_pass accepts http:// (or https://) upstream URLs
#   - nginx terminates the client connection and opens a new
#     one to the upstream (connection: close sent upstream)
#   - Adds x-real-ip / x-forwarded-for for the real client IP
# ============================================================
http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    # Default server — serves static files on port 80
    server {
        listen 80 default_server;

        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;
        server_name _;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # L7 reverse-proxy server on port 3002
    server {
        listen 3002;

        # Route requests at /server/* to the upstream.
        # The trailing slash on both location and proxy_pass strips
        # the /server/ prefix before forwarding (URI rewriting).
        location /server/ {

            # --- Header manipulation (only possible at L7) ---

            # Forward the original Host header so the upstream
            # knows which virtual host was requested.
            proxy_set_header Host $host;

            # Pass the real client IP — nginx sits between client
            # and upstream, so without this the upstream only
            # sees nginx's address.
            proxy_set_header X-Real-IP $remote_addr;

            # Append to any existing X-Forwarded-For chain so
            # the full proxy path is visible to the upstream.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Inject a custom header — not possible at L4.
            proxy_set_header test test-value;

            # http:// scheme is valid here (L7 only).
            # The upstream sees requests at / (prefix stripped).
            proxy_pass http://localhost:3080/;
        }
    }
}